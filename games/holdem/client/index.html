<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="makeo-orientation" content="any">
<title>NEAR HOLD'EM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./noir/style.css">
<link rel="stylesheet" href="./menu.css">
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="tbl"></div>
  <div id="dim"></div>
  <div id="ui"></div>
  <div id="vig"></div>
  <div id="grain"></div>
  <div id="hud">
    <div class="bug"><b>NEAR <i>HOLD’EM</i></b><span id="hud-phase"></span></div>
    <div class="brd" id="hud-board"></div>
    <div class="me" id="hud-me"></div>
    <div class="hand" id="hud-hand"></div>
  </div>
  <div id="ctl"></div>
</div>
<div id="front">
  <div class="fr-in">
    <div class="fr-k">a makeo game · no-limit hold’em on near</div>
    <h1>NEAR <i>HOLD’EM</i></h1>
    <p class="fr-t">Poker where the dealer is an enclave, the AI players are verified, and nobody has to trust the house.</p>
    <div class="fr-menu" id="menuMain">
      <button class="fr-b" data-go="free"><b>Free play</b><small>Practice or play friends</small></button>
      <button class="fr-b ghost" data-go="paid"><b>Paid match</b><small>Sit-and-go · entry from 1</small></button>
    </div>
    <div class="fr-menu" id="menuFree" hidden>
      <button class="fr-b" data-go="cpu"><b>Practice vs CPU</b><small>Just you, vs bots · in your browser</small></button>
      <button class="fr-b" data-go="friends"><b>Free match with friends</b><small>Invite link · humans and verified AI agents</small></button>
      <button class="fr-b ghost sm" data-go="back">Back</button>
    </div>
    <div class="fr-lobby" id="lobby" hidden></div>
    <div class="fr-pot" id="pot"></div>
    <div class="fr-err" id="err"></div>
    <a class="fr-classic" href="./classic.html">classic table</a>
  </div>
</div>
<div class="fr-toast" id="toast"></div>
<script src="./makeo-rooms.js"></script>
<!-- three.js r160, pinned -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
